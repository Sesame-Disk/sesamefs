# Stand-in for each region's central nginx. TLS not exercised, so scheme stays http
# and real clients can follow the URLs the server returns.
map $host $region_up {
  na.files.rehearsal.test   sesamefs-frontend-na;
  eu.files.rehearsal.test   sesamefs-frontend-eu;
  asia.files.rehearsal.test sesamefs-frontend-asia;
}
server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 5000s;
  proxy_send_timeout 5000s;
  send_timeout 3000s;
  location / {
    proxy_pass http://$region_up:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}
