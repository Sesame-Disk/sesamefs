# Stand-ins for the external systems only: an S3-compatible store with SSE-S3, a throwaway
# OIDC IdP and the regional central nginx. Test credentials, never real ones.
services:
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: rehearsalkey
      MINIO_ROOT_PASSWORD: rehearsalsecret123
      # Generated per run by rehearse.sh: 32 random bytes, base64.
      MINIO_KMS_SECRET_KEY: "rehearsal:${KMS_B64:?generated by rehearse.sh}"
    networks: {s3net: {aliases: [s3.rehearsal.test]}}
    healthcheck: {test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 3s, retries: 30}
  minio-init:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    depends_on: {minio: {condition: service_healthy}}
    networks: [s3net]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set r http://minio:9000 rehearsalkey rehearsalsecret123 &&
        mc mb --ignore-existing r/rehearsal-na r/rehearsal-eu r/rehearsal-asia && echo buckets-ready
  idp:
    image: golang:1.26.10-alpine
    command: ["go", "run", "-tags", "rehearsal", "/idp/idp.go"]
    environment: {ISSUER: "http://idp.rehearsal.test:8000", CLIENT_ID: rehearsal-client, CGO_ENABLED: "0"}
    volumes: ["../idp/idp.go:/idp/idp.go:ro"]
    # A non-RFC1918 test range: the OIDC client refuses issuers on private addresses.
    networks: {idpnet: {aliases: [idp.rehearsal.test], ipv4_address: 203.0.113.10}}
  central-nginx:
    image: nginx:stable-alpine
    volumes: ["./central-nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks:
      sfs-net: {aliases: [na.files.rehearsal.test, eu.files.rehearsal.test, asia.files.rehearsal.test]}
networks:
  sfs-net: {external: true}
  idpnet: {external: true, name: r3-idpnet}
  s3net: {external: true, name: r3-s3net}
